<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Notes</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <header class="topbar">
            <div class="topbar-inner">
                <h1>Notes</h1>
                <div id="user-box" class="user-box" hidden>
                    <span>Logged in as <b id="me"></b></span>
                    <button id="logout" type="button">Logout</button>
                </div>
            </div>
        </header>

        <main>
            <p id="message" role="status"></p>

            <!-- Shown when logged out -->
            <div id="auth-section" class="auth-grid">
                <section class="card">
                    <h2>Login</h2>
                    <form id="login-form">
                        <input
                            name="email"
                            type="email"
                            placeholder="Email"
                            required
                        />
                        <input
                            name="password"
                            type="password"
                            placeholder="Password"
                            required
                        />
                        <button>Login</button>
                    </form>
                </section>
                <section class="card">
                    <h2>Register</h2>
                    <form id="register-form">
                        <input name="name" placeholder="Name" required />
                        <input
                            name="email"
                            type="email"
                            placeholder="Email"
                            required
                        />
                        <input
                            name="password"
                            type="password"
                            placeholder="Password (min 8 characters)"
                            minlength="8"
                            required
                        />
                        <input
                            name="interests"
                            placeholder="Interests, comma separated"
                        />
                        <button>Create account</button>
                    </form>
                </section>
            </div>

            <!-- Shown when logged in -->
            <div id="app-section" hidden>
                <section class="card">
                    <h2>My profile</h2>
                    <form id="profile-form">
                        <input name="name" placeholder="Name" required />
                        <input
                            name="interests"
                            placeholder="Interests, comma separated"
                        />
                        <input
                            name="password"
                            type="password"
                            placeholder="New password (optional)"
                            minlength="8"
                        />
                        <button>Save</button>
                    </form>
                </section>

                <section class="card">
                    <h2>My notes</h2>
                    <form id="note-form">
                        <input name="title" placeholder="Title" required />
                        <input name="content" placeholder="Content" />
                        <button>Add note</button>
                    </form>
                    <ul id="notes-list"></ul>
                    <div class="pager">
                        <button id="notes-prev" class="secondary" type="button">
                            Prev
                        </button>
                        <span id="notes-page"></span>
                        <button id="notes-next" class="secondary" type="button">
                            Next
                        </button>
                    </div>
                </section>

                <section class="card">
                    <h2>Posts</h2>
                    <form id="post-form">
                        <input name="title" placeholder="Title" required />
                        <input name="content" placeholder="Content" required />
                        <button>Publish post</button>
                        <button id="my-posts" class="secondary" type="button">
                            View my posts
                        </button>
                    </form>
                    <h3>Everyone's posts</h3>
                    <ul id="posts-list"></ul>
                    <div class="pager">
                        <button id="posts-prev" class="secondary" type="button">
                            Prev
                        </button>
                        <span id="posts-page"></span>
                        <button id="posts-next" class="secondary" type="button">
                            Next
                        </button>
                    </div>
                </section>

                <!-- Scenario 2: one user's posts ($lookup) -->
                <section id="user-posts-section" class="card" hidden>
                    <h2 id="user-posts-title"></h2>
                    <ul id="user-posts-list"></ul>
                    <div class="pager">
                        <button
                            id="user-posts-prev"
                            class="secondary"
                            type="button"
                        >
                            Prev
                        </button>
                        <span id="user-posts-page"></span>
                        <button
                            id="user-posts-next"
                            class="secondary"
                            type="button"
                        >
                            Next
                        </button>
                        <button
                            id="user-posts-close"
                            class="danger"
                            type="button"
                        >
                            Close
                        </button>
                    </div>
                </section>

                <!-- Scenario 1: users grouped by interest (one aggregate call) -->
                <section class="card">
                    <h2>Users by interest</h2>
                    <form id="interest-form">
                        <input
                            name="interest"
                            placeholder="Filter by one interest"
                        />
                        <button>Filter</button>
                        <button
                            id="interest-clear"
                            class="secondary"
                            type="button"
                        >
                            Show all
                        </button>
                    </form>
                    <ul id="interests-list"></ul>
                    <div class="pager">
                        <button
                            id="interests-prev"
                            class="secondary"
                            type="button"
                        >
                            Prev
                        </button>
                        <span id="interests-page"></span>
                        <button
                            id="interests-next"
                            class="secondary"
                            type="button"
                        >
                            Next
                        </button>
                    </div>
                </section>

                <!-- Admin only. Hiding it is just convenience: the SERVER enforces access. -->
                <div id="admin-section" hidden>
                    <section class="card admin-card">
                        <h2>Admin: users</h2>
                        <form id="user-form">
                            <input name="name" placeholder="Name" required />
                            <input
                                name="email"
                                type="email"
                                placeholder="Email"
                                required
                            />
                            <input
                                name="password"
                                type="password"
                                placeholder="Password (min 8)"
                                minlength="8"
                                required
                            />
                            <select name="role">
                                <option value="user">user</option>
                                <option value="admin">admin</option>
                            </select>
                            <input
                                name="interests"
                                placeholder="Interests, comma separated"
                            />
                            <button>Create user</button>
                        </form>
                        <ul id="users-list"></ul>
                        <div class="pager">
                            <button
                                id="users-prev"
                                class="secondary"
                                type="button"
                            >
                                Prev
                            </button>
                            <span id="users-page"></span>
                            <button
                                id="users-next"
                                class="secondary"
                                type="button"
                            >
                                Next
                            </button>
                        </div>
                    </section>

                    <section class="card admin-card">
                        <h2>Admin: all notes (read-only)</h2>
                        <ul id="all-notes-list"></ul>
                        <div class="pager">
                            <button
                                id="all-notes-prev"
                                class="secondary"
                                type="button"
                            >
                                Prev
                            </button>
                            <span id="all-notes-page"></span>
                            <button
                                id="all-notes-next"
                                class="secondary"
                                type="button"
                            >
                                Next
                            </button>
                        </div>
                    </section>
                </div>
            </div>
        </main>

        <script src="app.js"></script>
    </body>
</html>
